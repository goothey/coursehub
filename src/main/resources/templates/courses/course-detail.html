<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.title} + ' | CourseHub'">Course | CourseHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h3" th:text="${course.title}">Course title</h1>
            <p class="text-muted mb-4">
                <span class="badge bg-primary me-1" th:text="${course.category}">CATEGORY</span>
                <span class="badge bg-secondary" th:text="${course.difficulty}">DIFFICULTY</span>
            </p>
            <dl class="row">
                <dt class="col-sm-3">Duration</dt>
                <dd class="col-sm-9" th:text="${course.durationHours} + ' hours'">0 hours</dd>
                <dt class="col-sm-3">Price</dt>
                <dd class="col-sm-9" th:text="'$' + ${course.price}">$0.00</dd>
                <dt class="col-sm-3">Added</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(course.createdAt, 'MMM d, yyyy h:mm a')}">Date</dd>
            </dl>
            <p th:text="${course.description}">Description</p>
            <a th:href="@{/courses/new}" class="btn btn-outline-primary">Add another course</a>
        </div>
    </div>
</main>
</body>
</html>
