<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Course | CourseHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h3 mb-4">Add a New Course</h1>

            <form th:action="@{/courses}" th:object="${course}" method="post" novalidate class="card card-body shadow-sm">

                <!-- Title -->
                <div class="mb-3">
                    <label for="title" class="form-label">Course title <span class="text-danger">*</span></label>
                    <input type="text" id="title" th:field="*{title}"
                           class="form-control" th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                           placeholder="e.g. Intro to Java Programming">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="row">
                    <!-- Category -->
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                        <select id="category" th:field="*{category}"
                                class="form-select" th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                            <option value="" disabled selected>Choose a category</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                    </div>

                    <!-- Difficulty -->
                    <div class="col-md-6 mb-3">
                        <label for="difficulty" class="form-label">Difficulty <span class="text-danger">*</span></label>
                        <select id="difficulty" th:field="*{difficulty}"
                                class="form-select" th:classappend="${#fields.hasErrors('difficulty')} ? 'is-invalid'">
                            <option value="" disabled selected>Choose a level</option>
                            <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{difficulty}"></div>
                    </div>
                </div>

                <div class="row">
                    <!-- Duration -->
                    <div class="col-md-6 mb-3">
                        <label for="durationHours" class="form-label">Duration (hours) <span class="text-danger">*</span></label>
                        <input type="number" id="durationHours" th:field="*{durationHours}"
                               class="form-control" th:classappend="${#fields.hasErrors('durationHours')} ? 'is-invalid'"
                               min="1" max="200">
                        <div class="invalid-feedback" th:errors="*{durationHours}"></div>
                    </div>

                    <!-- Price -->
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label">Price ($) <span class="text-danger">*</span></label>
                        <input type="number" id="price" th:field="*{price}"
                               class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                               min="0" step="0.01">
                        <div class="invalid-feedback" th:errors="*{price}"></div>
                    </div>
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="form-label">Description <span class="text-muted">(optional)</span></label>
                    <textarea id="description" th:field="*{description}" rows="4"
                              class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Course</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
