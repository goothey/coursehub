spring.application.name=coursehub

# H2 in-memory database for local development
spring.datasource.url=jdbc:h2:mem:coursehub;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# Create the tables first, then run data.sql to seed sample courses
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
